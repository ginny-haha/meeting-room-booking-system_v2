<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>內部會議室預約系統 (GMT+8)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* 為了美化滾動條與表格對齊 */
    .time-slot-grid {
      grid-template-columns: 140px repeat(28, minmax(70px, 1fr));
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-12">

  <header class="bg-blue-600 text-white shadow-md px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
    <div>
      <h1 class="text-xl font-bold tracking-wide">內部會議室預約系統</h1>
      <p class="text-xs text-blue-200 mt-1">系統時間統一以台灣時間 (GMT+8) 為基準</p>
    </div>
    <div class="flex items-center gap-2 bg-white/10 p-1.5 rounded-lg border border-white/20">
      <button onclick="changeDate(-1)" class="px-2 py-1 hover:bg-white/20 rounded text-sm transition">◀ 前一天</button>
      <input type="date" id="currentDatePicker" class="bg-white text-gray-900 px-3 py-1 rounded border-none focus:ring-2 focus:ring-blue-400 font-semibold text-sm">
      <button onclick="changeDate(1)" class="px-2 py-1 hover:bg-white/20 rounded text-sm transition">後一天 ▶</button>
      <button onclick="setToToday()" class="ml-2 bg-white text-blue-600 font-medium px-3 py-1 rounded text-xs hover:bg-blue-50 transition">今日</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto mt-6 px-4">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="p-4 border-b border-gray-100 flex gap-4 text-xs">
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-white border border-gray-300 rounded"></span> 閒置（可點擊預約）</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-blue-500 rounded"></span> 已預約（點擊可查看/取消）</div>
      </div>

      <div class="overflow-x-auto">
        <div class="time-slot-grid grid min-w-[1300px] border-b border-gray-200 bg-gray-100 font-semibold text-xs text-gray-600 text-center sticky top-0 z-10">
          <div class="p-3 text-left bg-gray-100 sticky left-0 z-20 shadow-[2px_0_5px_rgba(0,0,0,0.05)]">會議室名稱</div>
          <script>
            let timeHeaders = "";
            for(let h=6; h<20; h++) {
              let hh = String(h).padStart(2, '0');
              timeHeaders += `<div class="p-3 border-l border-gray-200">${hh}:00</div><div class="p-3 border-l border-gray-200">${hh}:30</div>`;
            }
            document.write(timeHeaders);
          </script>
        </div>

        <div id="roomRowsContainer" class="min-w-[1300px] divide-y divide-gray-200">
          </div>
      </div>
    </div>
  </main>

  <div id="bookingModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full overflow-hidden border border-gray-100">
      <div class="bg-blue-600 text-white px-6 py-4">
        <h3 class="font-bold text-lg" id="modalTitle">新增會議室預約</h3>
        <p class="text-xs text-blue-100 mt-1" id="modalSubTitle"></p>
      </div>
      <form id="bookingForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
        <input type="hidden" id="formRoomName">
        <input type="hidden" id="formDate">
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">申請人姓名 *</label>
            <input type="text" id="formUserName" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">申請部門 *</label>
            <input type="text" id="formDepartment" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="如：人資部">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">開始時間</label>
            <select id="formStartTime" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-gray-50 cursor-not-allowed" readonly></select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">結束時間 (可延長時段) *</label>
            <select id="formEndTime" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"></select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">預約目的 *</label>
          <input type="text" id="formPurpose" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="如：部門週會、面試">
        </div>

        <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-3">
          <div class="flex items-center justify-between">
            <label class="text-xs font-bold text-gray-700">循環預訂設定</label>
            <select id="formCycleType" onchange="toggleCycleDate()" class="border border-gray-300 rounded px-2 py-1 text-xs focus:outline-none">
              <option value="single">單次預約 (預設)</option>
              <option value="weekly">每週循環</option>
              <option value="monthly">每月循環</option>
            </select>
          </div>
          <div id="cycleEndContainer" class="hidden">
            <label class="block text-[11px] font-bold text-gray-500 mb-1">循環結束日期 *</label>
            <input type="date" id="formCycleEndDate" class="w-full border border-gray-300 rounded px-2 py-1 text-xs">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">自訂4位數取消密碼 *</label>
          <input type="password" id="formPassword" required maxlength="4" pattern="\d{4}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 text-center tracking-widest" placeholder="0000">
          <p class="text-[11px] text-gray-400 mt-1">日後取消或變更時驗證使用</p>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeModal('bookingModal')" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 transition">取消</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 shadow-sm transition">完成預約</button>
        </div>
      </form>
    </div>
  </div>

  <div id="detailModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-sm w-full overflow-hidden border border-gray-100">
      <div class="bg-gray-800 text-white px-6 py-4">
        <h3 class="font-bold text-lg">會議室預約詳情</h3>
        <p class="text-xs text-gray-400 mt-1" id="detailRoomAndDate"></p>
      </div>
      <div class="p-6 space-y-4">
        <div class="space-y-2 text-sm">
          <div><span class="text-gray-400 inline-block w-20">使用時段：</span><strong id="detailTime"></strong></div>
          <div><span class="text-gray-400 inline-block w-20">申請部門：</span><strong id="detailDept"></strong></div>
          <div><span class="text-gray-400 inline-block w-20">申 請 人：</span><strong id="detailUser"></strong></div>
          <div><span class="text-gray-400 inline-block w-20">預約目的：</span><strong id="detailPurpose"></strong></div>
          <div id="detailCycleTag" class="hidden text-xs bg-amber-50 text-amber-700 px-2 py-1 rounded border border-amber-200 inline-block">🔄 這是循環預約會議</div>
        </div>

        <div class="pt-4 border-t border-gray-100 space-y-2">
          <label class="block text-xs font-bold text-gray-600">請輸入4位數取消密碼：</label>
          <input type="password" id="detailCancelPassword" maxlength="4" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-center tracking-widest" placeholder="0000">
          
          <div id="detailCancelCycleOptions" class="hidden bg-red-50 p-3 rounded-lg border border-red-100 space-y-2 mt-2">
            <p class="text-xs font-bold text-red-800">此會議為循環預約，請選擇取消範圍：</p>
            <div class="space-y-1">
              <label class="flex items-center gap-2 text-xs text-gray-700 cursor-pointer">
                <input type="radio" name="cancelScope" value="single" checked class="text-red-600"> 僅取消本日會議
              </label>
              <label class="flex items-center gap-2 text-xs text-gray-700 cursor-pointer">
                <input type="radio" name="cancelScope" value="future" class="text-red-600"> 取消本日及後續所有循環會議
              </label>
            </div>
          </div>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeModal('detailModal')" class="w-1/2 px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 transition">關閉</button>
          <button type="button" onclick="executeCancelBooking()" class="w-1/2 px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700 shadow-sm transition">❌ 取消此預訂</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 已自動填入您的 Supabase 專案 API 設定
    // ==========================================
    const SUPABASE_URL = "https://qxufxvludifixkmlhjzk.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4dWZ4dmx1ZGlmaXhrbWxoanprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NDg4NTQsImV4cCI6MjA5NjAyNDg1NH0.62E4O5ioE5_po5UZMQ9d3yBrnzfKnLJZm0XtvKn_RxU";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 預設定義的 5 間會議室標的
    const ROOMS = [
      "台北大會議室",
      "台北小會議室",
      "彰化大會議室",
      "彰化小會議室",
      "越南AP會議室(台灣時間)"
    ];

    // 初始化營業時段（06:00 - 20:00，以每半小時切片，共28個時段）
    const TIME_SLOTS = [];
    for(let h = 6; h < 20; h++) {
      let hh = String(h).padStart(2, '0');
      TIME_SLOTS.push(`${hh}:00`);
      TIME_SLOTS.push(`${hh}:30`);
    }
    // 補上最後一個邊界臨界值供算截止時間使用
    TIME_SLOTS.push("20:00");

    let currentSelectedDate = "";
    let loadedBookingsData = []; // 當天已撈取之預約紀錄資料快照
    let activeDetailBooking = null; // 當前正在點擊查看詳情的對象物件

    // 初始化啟動
    window.onload = function() {
      setToToday();
      document.getElementById('currentDatePicker').addEventListener('change', function(e) {
        currentSelectedDate = e.target.value;
        fetchAndRenderDashboard();
      });
    };

    function setToToday() {
      // 強制轉換為台灣 GMT+8 當日日期字串 (YYYY-MM-DD)
      const twDateString = new Date().toLocaleDateString('zh-TW', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '-');
      currentSelectedDate = twDateString;
      document.getElementById('currentDatePicker').value = twDateString;
      fetchAndRenderDashboard();
    }

    function changeDate(days) {
      let d = new Date(currentSelectedDate);
      d.setDate(d.getDate() + days);
      currentSelectedDate = d.toISOString().split('T')[0];
      document.getElementById('currentDatePicker').value = currentSelectedDate;
      fetchAndRenderDashboard();
    }

    // 從 Supabase 後端即時獲取並渲染主畫面
    async function fetchAndRenderDashboard() {
      const container = document.getElementById('roomRowsContainer');
      container.innerHTML = `<div class="p-8 text-center text-gray-400">系統即時資料載入中...</div>`;

      try {
        // 撈取當天該日期的所有預約
        const { data, error } = await supabase
          .from('bookings')
          .select('*')
          .eq('booking_date', currentSelectedDate);

        if (error) throw error;
        loadedBookingsData = data || [];
        
        renderDashboardStructure();
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="p-8 text-center text-red-500">資料讀取失敗，請確認 Supabase Table 是否已正確建立。</div>`;
      }
    }

    // 渲染時間主看板矩陣
    function renderDashboardStructure() {
      const container = document.getElementById('roomRowsContainer');
      container.innerHTML = "";

      ROOMS.forEach(room => {
        const rowDiv = document.createElement('div');
        rowDiv.className = "time-slot-grid grid items-stretch hover:bg-gray-50/50 transition";

        // 最左側固定：房間欄位名稱
        const roomNameLabel = document.createElement('div');
        roomNameLabel.className = "p-3 font-semibold text-gray-700 bg-white border-r border-gray-200 text-xs flex items-center sticky left-0 z-10 shadow-[2px_0_5px_rgba(0,0,0,0.02)]";
        roomNameLabel.innerText = room;
        rowDiv.appendChild(roomNameLabel);

        // 橫軸循環渲染 28 個半小時格子 (排除最後的 20:00 邊界)
        for (let i = 0; i < TIME_SLOTS.length - 1; i++) {
          const slotStart = TIME_SLOTS[i];
          const slotEnd = TIME_SLOTS[i+1];

          // 判斷此半小時時段是否已有被預約覆蓋
          const matchBooking = loadedBookingsData.find(b => {
            return b.room_name === room && (slotStart >= b.start_time.substring(0,5) && slotStart < b.end_time.substring(0,5));
          });

          const gridCell = document.createElement('div');
          gridCell.className = "border-l border-gray-200 p-1 min-h-[50px] flex items-stretch text-[11px]";

          if (matchBooking) {
            // 已預約狀態：渲染顯眼色塊
            const isFirstSlot = (slotStart === matchBooking.start_time.substring(0,5));
            
            const bookedBlock = document.createElement('button');
            bookedBlock.className = `w-full text-left p-1 rounded bg-blue-500 text-white font-medium overflow-hidden shadow-sm hover:bg-blue-600 transition truncate cursor-pointer ${isFirstSlot ? 'rounded-l' : ''}`;
            bookedBlock.title = `${matchBooking.department}-${matchBooking.purpose} (${matchBooking.start_time.substring(0,5)}-${matchBooking.end_time.substring(0,5)})`;
            
            if (isFirstSlot) {
              bookedBlock.innerText = `${matchBooking.department}-${matchBooking.purpose}`;
            }
            
            bookedBlock.onclick = () => openDetailModal(matchBooking);
            gridCell.appendChild(bookedBlock);
          } else {
            // 閒置狀態：允許點擊觸發新增預約流程
            const emptyBtn = document.createElement('button');
            emptyBtn.className = "w-full h-full rounded hover:bg-blue-50/70 border border-transparent hover:border-blue-200 transition cursor-pointer";
            emptyBtn.onclick = () => openBookingModal(room, currentSelectedDate, slotStart);
            gridCell.appendChild(emptyBtn);
          }

          rowDiv.appendChild(gridCell);
        }

        container.appendChild(rowDiv);
      });
    }

    // 開啟預約表單設定
    function openBookingModal(room, date, startTime) {
      document.getElementById('bookingForm').reset();
      
      document.getElementById('formRoomName').value = room;
      document.getElementById('formDate').value = date;
      document.getElementById('modalTitle').innerText = `預約：${room}`;
      document.getElementById('modalSubTitle').innerText = `預約日期：${date}`;

      // 下拉設定：開始時間固定
      const startSelect = document.getElementById('formStartTime');
      startSelect.innerHTML = `<option value="${startTime}">${startTime}</option>`;

      // 下拉設定：動態填充結束時間（必須大於開始時間）
      const endSelect = document.getElementById('formEndTime');
      endSelect.innerHTML = "";
      const startIndex = TIME_SLOTS.indexOf(startTime);
      
      for(let j = startIndex + 1; j < TIME_SLOTS.length; j++) {
        endSelect.innerHTML += `<option value="${TIME_SLOTS[j]}">${TIME_SLOTS[j]}</option>`;
      }

      toggleCycleDate();
      document.getElementById('bookingModal').classList.remove('hidden');
    }

    function toggleCycleDate() {
      const type = document.getElementById('formCycleType').value;
      const container = document.getElementById('cycleEndContainer');
      if (type === 'single') {
        container.classList.add('hidden');
        document.getElementById('formCycleEndDate').removeAttribute('required');
      } else {
        container.classList.remove('hidden');
        document.getElementById('formCycleEndDate').setAttribute('required', 'required');
      }
    }

    // 【核心機制：防撞期送出控管與循環拆解】
    async function handleFormSubmit(e) {
      e.preventDefault();

      const room_name = document.getElementById('formRoomName').value;
      const base_date = document.getElementById('formDate').value;
      const start_time = document.getElementById('formStartTime').value;
      const end_time = document.getElementById('formEndTime').value;
      const user_name = document.getElementById('formUserName').value;
      const department = document.getElementById('formDepartment').value;
      const purpose = document.getElementById('formPurpose').value;
      const cancel_password = document.getElementById('formPassword').value;
      const cycle_type = document.getElementById('formCycleType').value;
      const cycle_end_date = document.getElementById('formCycleEndDate').value;

      // 1. 根據單次或循環，算出「所有需要預約的日期陣列」
      let datesToBook = [base_date];

      if (cycle_type !== 'single') {
        let currentLoopDate = new Date(base_date);
        const finalLimitDate = new Date(cycle_end_date);
        
        if (finalLimitDate <= currentLoopDate) {
          alert("循環結束日期必須大於起始預約日期！");
          return;
        }

        while (true) {
          if (cycle_type === 'weekly') {
            currentLoopDate.setDate(currentLoopDate.getDate() + 7);
          } else if (cycle_type === 'monthly') {
            currentLoopDate.setMonth(currentLoopDate.getMonth() + 1);
          }
          
          if (currentLoopDate > finalLimitDate) break;
          datesToBook.push(currentLoopDate.toISOString().split('T')[0]);
        }
      }

      const group_id = cycle_type !== 'single' ? crypto.randomUUID() : null;

      // 2. 🔐 即時防撞期審查
      try {
        const { data: currentDbBookings, error } = await supabase
          .from('bookings')
          .select('*')
          .eq('room_name', room_name)
          .in('booking_date', datesToBook);

        if (error) throw error;

        let conflictDates = [];
        let availableDates = [];

        datesToBook.forEach(date => {
          const isOverlapped = currentDbBookings.some(db => {
            const dbStart = db.start_time.substring(0,5);
            const dbEnd = db.end_time.substring(0,5);
            return db.booking_date === date && (start_time < dbEnd && end_time > dbStart);
          });

          if (isOverlapped) {
            conflictDates.push(date);
          } else {
            availableDates.push(date);
          }
        });

        if (cycle_type === 'single' && conflictDates.length > 0) {
          alert("很遺憾，此時段剛剛已被其他同仁搶先預約，請選擇其他時段！");
          closeModal('bookingModal');
          fetchAndRenderDashboard();
          return;
        }

        if (availableDates.length === 0) {
          alert(`預約失敗：您選擇的循環時段在未來所有指定日期皆已被其他人佔用！`);
          return;
        }

        // 3. 執行批次寫入
        const insertRows = availableDates.map(date => ({
          room_name,
          booking_date: date,
          start_time: start_time + ":00",
          end_time: end_time + ":00",
          user_name,
          department,
          purpose,
          cancel_password,
          group_id
        }));

        const { error: insertErr } = await supabase.from('bookings').insert(insertRows);
        if (insertErr) throw insertErr;

        if (conflictDates.length > 0) {
          alert(`提醒：日期 ${conflictDates.join(', ')} 的時段已被佔用，其餘成功為您預約完成！`);
        } else {
          alert("會議室預約成功！");
        }

        closeModal('bookingModal');
        fetchAndRenderDashboard();

      } catch (err) {
        console.error(err);
        alert("資料庫連線突發異常，請稍後再試。");
      }
    }

    // 開啟查看與取消明細視窗
    function openDetailModal(bookingObj) {
      activeDetailBooking = bookingObj;
      document.getElementById('detailCancelPassword').value = "";
      
      document.getElementById('detailRoomAndDate').innerText = `${bookingObj.room_name} ｜ ${bookingObj.booking_date}`;
      document.getElementById('detailTime').innerText = `${bookingObj.start_time.substring(0,5)} - ${bookingObj.end_time.substring(0,5)}`;
      document.getElementById('detailDept').innerText = bookingObj.department;
      document.getElementById('detailUser').innerText = bookingObj.user_name;
      document.getElementById('detailPurpose').innerText = bookingObj.purpose;

      const cycleTag = document.getElementById('detailCycleTag');
      const cycleOptions = document.getElementById('detailCancelCycleOptions');
      if (bookingObj.group_id) {
        cycleTag.classList.remove('hidden');
        cycleOptions.classList.remove('hidden');
      } else {
        cycleTag.classList.add('hidden');
        cycleOptions.classList.add('hidden');
      }

      document.getElementById('detailModal').classList.remove('hidden');
    }

    // 執行刪除與取消邏輯
    async function executeCancelBooking() {
      if (!activeDetailBooking) return;

      const inputPwd = document.getElementById('detailCancelPassword').value;
      if (inputPwd !== activeDetailBooking.cancel_password) {
        alert("密碼驗證錯誤，不可取消！");
        return;
      }

      const isCycle = !!activeDetailBooking.group_id;
      let cancelScope = "single";
      
      if (isCycle) {
        cancelScope = document.querySelector('#detailCancelCycleOptions input[name="cancelScope"]:checked')?.value || "single";
      }

      try {
        let query = supabase.from('bookings').delete();

        if (isCycle && cancelScope === 'future') {
          query = query
            .eq('group_id', activeDetailBooking.group_id)
            .gte('booking_date', activeDetailBooking.booking_date);
        } else {
          query = query.eq('id', activeDetailBooking.id);
        }

        const { error } = await query;
        if (error) throw error;

        alert("已成功釋放並取消該會議室預約紀錄！");
        closeModal('detailModal');
        fetchAndRenderDashboard();

      } catch (err) {
        console.error(err);
        alert("刪除失敗，請檢查網路連線。");
      }
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.add('hidden');
    }
  </script>
</body>
</html>
